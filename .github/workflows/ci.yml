name: CI

on:
  push:
  pull_request:

# The application lives under frontend/ — there is no root-level package.json.
defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # postinstall runs `prisma generate`, which needs no database connection.
      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: availo
          POSTGRES_PASSWORD: availo
          POSTGRES_DB: availo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U availo -d availo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # Replaces the docker-compose container used locally. Nothing in CI ever
      # sees a real database URL.
      TEST_DATABASE_URL: postgresql://availo:availo@localhost:5432/availo_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The project's globalSetup applies migrations to the service container.
      - run: npx vitest run --project integration
