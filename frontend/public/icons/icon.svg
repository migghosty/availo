<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source artwork for every app icon, rasterized by scripts/generate-icons.mjs.

  The glyph is drawn as stroked <path> geometry rather than <text> on purpose:
  no font is guaranteed to exist inside the rasterizer (or on a build machine),
  so a <text> element would silently render as a blank square. The login page's
  scissors emoji has the same problem, which is why this is a plain letterform.

  Full-bleed with square corners, because iOS applies its own rounded mask to
  an apple-touch-icon — rounding it here would show as a dark halo inside the
  system's corners. The maskable variant (icon-maskable.svg) is the padded one.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1e293b"/>
  <g fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <path d="M154 396 L256 132 L358 396"/>
    <path d="M195 306 H317"/>
  </g>
</svg>
